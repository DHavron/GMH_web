    </div>
  </footer>

  <script src="i18n.js"></script>
  <script>
    (function () {
      function ready(fn) {
        if (document.readyState !== "loading") fn();
        else document.addEventListener("DOMContentLoaded", fn);
      }
      ready(function () {
        try { localStorage.removeItem("gmh-content-exported-v1"); } catch (e) {}
        function done() {
          try { window.__gmhDataLoaded = true; } catch (e) {}
          if (window.__gmhStart) window.__gmhStart();
        }
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "site-data.json?_=" + Date.now(), true);
        xhr.onload = function () {
          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              var d = JSON.parse(xhr.responseText);
              if (d && d.ru && d.en) localStorage.setItem("gmh-content-exported-v1", JSON.stringify(d));
            } catch (e) {}
          }
          done();
        };
        xhr.onerror = xhr.ontimeout = done;
        xhr.timeout = 4000;
        xhr.send();
      });
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
